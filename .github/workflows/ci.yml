name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (ядро)
        run: cargo clippy -p a7800-core --all-targets
      - name: Тесты
        run: cargo test -p a7800-core
      - name: Функциональный тест 6502 (Klaus Dormann)
        continue-on-error: true
        run: |
          curl -sSfL -o "$RUNNER_TEMP/6502_functional_test.bin" \
            https://raw.githubusercontent.com/Klaus2m5/6502_65C02_functional_tests/master/bin_files/6502_functional_test.bin
          A7800_FUNCTIONAL_TEST="$RUNNER_TEMP/6502_functional_test.bin" \
            cargo test -p a7800-core --release --test functional -- --nocapture

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Сборка wasm
        run: wasm-pack build crates/a7800-web --target web --release --out-dir ../../web/pkg
      - name: Проверка собранного wasm (тестовый ROM → кадр и звук)
        run: node tests/smoke.mjs
      - name: Убираем служебные файлы
        run: rm -f web/pkg/.gitignore web/pkg/package.json web/pkg/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
